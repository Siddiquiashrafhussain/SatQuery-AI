name: satquery-ai

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: satquery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-satquery}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-satquery}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satquery_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - STORAGE_PATH=${STORAGE_PATH:-/app/storage}
      - MODEL_PATH=${MODEL_PATH:-/app/models}
    volumes:
      - ./backend:/app
      - backend_storage:${STORAGE_PATH:-/app/storage}
      - backend_models:${MODEL_PATH:-/app/models}
    depends_on:
      db:
        condition: service_healthy
    # Note: GPU worker architecture placeholder
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satquery_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # -------------------------------------------------------------
  # Future Architecture Services (Commented out for now)
