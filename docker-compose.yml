name: satquery-ai

services:


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satquery_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - STORAGE_PATH=${STORAGE_PATH:-/app/storage}
      - MODEL_PATH=${MODEL_PATH:-/app/models}
    volumes:
      - ./backend:/app
      - backend_storage:${STORAGE_PATH:-/app/storage}
      - backend_models:${MODEL_PATH:-/app/models}

  preprocessing:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satquery_preprocessing
    restart: unless-stopped
    command: ["python", "preprocessing/worker.py"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - STORAGE_PATH=${STORAGE_PATH:-/app/storage}
    volumes:
      - ./backend:/app
      - backend_storage:${STORAGE_PATH:-/app/storage}
    depends_on:
      - backend

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: satquery_ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MODEL_ID=${MODEL_ID:-microsoft/Florence-2-base}
    volumes:
      - ./ml:/app
      - backend_storage:${STORAGE_PATH:-/app/storage}
      - backend_models:${MODEL_PATH:-/app/models}

    # Note: GPU worker architecture placeholder
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  change_detection:
    build:
      context: ./change_detection
      dockerfile: Dockerfile
    container_name: satquery_change_detection
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./change_detection:/app
      - backend_storage:${STORAGE_PATH:-/app/storage}

  fusion:
    build:
      context: ./fusion
      dockerfile: Dockerfile
    container_name: satquery_fusion
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - ML_SERVICE_URL=http://ml:8001
    volumes:
      - ./fusion:/app
      - backend_storage:${STORAGE_PATH:-/app/storage}

  caddy:
    image: caddy:2.7.6-alpine
    container_name: satquery_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # -------------------------------------------------------------
  # Future Architecture Services (Commented out for now)
  # -------------------------------------------------------------

  # redis:
  #   image: redis:7-alpine
  #   container_name: satquery_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: satquery_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  backend_storage:
  backend_models:
  # redis_data:
  minio_data:
  caddy_data:
  caddy_config:
